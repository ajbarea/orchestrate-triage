[project]
name = "orchestrate-triage"
version = "0.1.0"
description = "HackerRank Orchestrate — multi-domain support triage agent"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.97.0",
    "python-dotenv>=1.0.1",
    "pydantic>=2.9.0",
    "tqdm>=4.66.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
